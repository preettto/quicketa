# QuickETA — docker-compose.yml
# Phase 3: infrastructure (MongoDB sharded cluster, Kafka, PostgreSQL, Redis)
# Application services (API, consumers, pipeline, nginx) are added in later phases.

name: quicketa

x-mongod: &mongod
  image: mongo:7.0
  networks: [backend]
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 600m
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 5s
    timeout: 5s
    retries: 20

services:
  # ---------------- MongoDB: config server replica set (1 node) ----------------
  cfg1:
    <<: *mongod
    container_name: qe-cfg1
    command: mongod --configsvr --replSet cfgRS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes: [cfg1_data:/data/configdb]

  # ---------------- MongoDB: shard 1 replica set (3 nodes) ----------------
  shard1a:
    <<: *mongod
    container_name: qe-shard1a
    command: mongod --shardsvr --replSet shard1RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes: [shard1a_data:/data/db]
  shard1b:
    <<: *mongod
    container_name: qe-shard1b
    command: mongod --shardsvr --replSet shard1RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes: [shard1b_data:/data/db]
  shard1c:
    <<: *mongod
    container_name: qe-shard1c
    command: mongod --shardsvr --replSet shard1RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes: [shard1c_data:/data/db]

  # ---------------- MongoDB: shard 2 replica set (3 nodes) ----------------
  shard2a:
    <<: *mongod
    container_name: qe-shard2a
    command: mongod --shardsvr --replSet shard2RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes: [shard2a_data:/data/db]
  shard2b:
    <<: *mongod
    container_name: qe-shard2b
    command: mongod --shardsvr --replSet shard2RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes: [shard2b_data:/data/db]
  shard2c:
    <<: *mongod
    container_name: qe-shard2c
    command: mongod --shardsvr --replSet shard2RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes: [shard2c_data:/data/db]

  # ---------------- MongoDB: one-shot cluster initialiser ----------------
  mongo-init:
    image: mongo:7.0
    container_name: qe-mongo-init
    networks: [backend]
    volumes: [./infra/mongo/init-cluster.sh:/init-cluster.sh:ro]
    entrypoint: ["bash", "/init-cluster.sh"]
    depends_on:
      cfg1: {condition: service_healthy}
      shard1a: {condition: service_healthy}
      shard1b: {condition: service_healthy}
      shard1c: {condition: service_healthy}
      shard2a: {condition: service_healthy}
      shard2b: {condition: service_healthy}
      shard2c: {condition: service_healthy}
    restart: "no"

  # ---------------- MongoDB: query router (the only entry point for apps) ----------------
  mongos:
    image: mongo:7.0
    container_name: qe-mongos
    command: mongos --configdb cfgRS/cfg1:27017 --port 27017 --bind_ip_all
    networks: [backend]
    ports: ["27017:27017"]
    restart: unless-stopped   # retries until the config replica set has been initiated
    depends_on:
      cfg1: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: 400m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------- Kafka (KRaft mode, single broker) ----------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: qe-kafka
    networks: [backend]
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: qe-kafka-init
    networks: [backend]
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic order_placed --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic order_placed
    restart: "no"

  # ---------------- PostgreSQL: partner / restaurant source DB (P6 source #3) ----------------
  postgres:
    image: postgres:16-alpine
    container_name: qe-postgres
    networks: [backend]
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: quicketa
      POSTGRES_PASSWORD: quicketa
      POSTGRES_DB: partners
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quicketa -d partners"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---------------- Redis: cache + live stats (P7) ----------------
  redis:
    image: redis:7-alpine
    container_name: qe-redis
    networks: [backend]
    ports: ["6379:6379"]
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ================= APPLICATION (one image: quicketa-app) =================
  # Batch EtLT pipeline (P6) - run on demand:  docker compose run --rm pipeline
  pipeline:
    build: .
    image: quicketa-app:latest
    container_name: qe-pipeline
    profiles: ["jobs"]
    networks: [backend]
    command: python -m app.pipeline.run_pipeline
    volumes:
      - ./data:/srv/data
      - ./models:/srv/models
    depends_on:
      mongos: {condition: service_healthy}
      postgres: {condition: service_healthy}

  # API (P1 REST + P2 GraphQL).  Phase 7 will scale this to api1..api3 behind nginx.
  api1:
    image: quicketa-app:latest
    container_name: qe-api1
    networks: [backend]
    ports: ["8000:8000"]
    environment:
      INSTANCE_NAME: api1
      TZ: Asia/Kolkata
    command: gunicorn -w 2 --threads 4 -b 0.0.0.0:8000 --access-logfile - "app.api.main:create_app()"
    volumes:
      - ./models:/srv/models:ro
    depends_on:
      mongos: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  backend:
    name: quicketa_backend

volumes:
  cfg1_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data:
  pg_data:
