# QuickETA - Layer-7 load balancer / API gateway (P8)
worker_processes auto;
events { worker_connections 1024; }

http {
    log_format upstream_log '$remote_addr "$request" $status -> $upstream_addr '
                            'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout upstream_log;
    error_log  /dev/stderr warn;

    # Round-robin is nginx's default algorithm: requests go api1 -> api2 -> api3 -> api1 ...
    upstream api_pool {
        server api1:8000 max_fails=1 fail_timeout=10s;   # passive health check: after 1 failure,
        server api2:8000 max_fails=1 fail_timeout=10s;   # the server is skipped for 10 s
        server api3:8000 max_fails=1 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # failover: if a replica is down / refuses the connection, retry on the next one
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 1s;
            proxy_read_timeout 15s;

            add_header X-Upstream $upstream_addr always;   # shows which replica answered
        }

        location = /nginx-health { return 200 "nginx ok\n"; }
    }
}
